experiment:
  id: EXP-002V
  name: preregistered_exp002_verification
  master_seed: 20260818

data:
  n_train: 5000
  n_val: 2000
  n_test: 3000
  rho_train_values: [0.0, 0.5, 0.7, 0.9]
  rho_ood_values: [0.3, 0.0, -0.3, -0.6, -0.9]
  label_noise: 0.5
  stable_coefficients: [1.2, -1.0, 0.8]

replicates:
  default: 10
  anchor_rho: 0.9
  anchor: 20

statistics:
  bootstrap_resamples: 10000
  confidence_level: 0.95

generator_validation:
  max_abs_rho_error: 0.08
  positive_rate_min: 0.44
  positive_rate_max: 0.56
  max_abs_stable_mean_difference: 0.12
  max_abs_stable_variance_difference: 0.15
  max_stable_ks_statistic: 0.08
  max_abs_stable_oracle_accuracy_difference: 0.04
  max_abs_noise_target_correlation: 0.08

models:
  logistic_regression:
    C: 1.0
    max_iter: 1000
  rbf_svm:
    C: 1.0
    gamma: scale
    cache_size: 1000
    calibration_cv: 3
  random_forest:
    n_estimators: 250
    min_samples_leaf: 2
    n_jobs: -1
  gradient_boosting:
    learning_rate: 0.08
    max_iter: 200
    max_leaf_nodes: 31
    l2_regularization: 0.1
  mlp:
    hidden_layer_sizes: [64, 64]
    alpha: 0.001
    learning_rate_init: 0.001
    max_iter: 250
    early_stopping: true
